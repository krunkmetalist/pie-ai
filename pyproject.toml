[project]
name = "pie-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "nate", email = "nate@adeptusaudio.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
pie-ai = "pie_ai:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
